schema_version: 1

inputs:
  # RDS preserves factor and ordered-factor columns.
  data: inputs/analysis.rds
  phenotype_metadata: phenotype-metadata-outcomes.tsv

analysis:
  analysis_id: demo_pgs_to_phenome
  direction: phenotypes_as_outcomes
  anchor: pgs
  anchor_type: numeric
  anchor_transform: zscore
  covariates: [age, sex]
  fdr_threshold: 0.05
  eligibility:
    min_n: 100
    min_cases: 10
    min_controls: 10
    min_outcome_levels: 3

execution:
  shards: 2
  backend: sequential
  workers: 1

output:
  directory: phewasflow-output/forward

plot:
  # Writes phewas.png, phewas.pdf, phewas-volcano.png, and phewas-volcano.pdf.
  output: phewasflow-output/forward/phewas.png
  significance: bonferroni
  group_display: legend
  label: []
  highlight: []
  width: 10
  height: 6
  dpi: 300
